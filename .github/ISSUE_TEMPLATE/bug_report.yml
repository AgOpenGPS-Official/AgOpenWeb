name: Bug report
description: Report a bug (any language welcome). A Bug Report Dump is required.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start**
        1. Install the latest [Nightly build](https://github.com/AgOpenGPS-Official/AgOpenWeb/releases/tag/nightly) and check the problem still happens on it.
        2. Right after it happens, make a **Bug Report Dump** (main menu → Bug Report Dump). It saves a `bugreport_….zip` with your settings, the field and the last 5 minutes of GPS data.

        Reports without the form filled in and the dump attached are not accepted.

        Write in any language. You don't need to use English: the maintainers translate every report. Please keep log text, error messages and menu names exactly as they appear. Don't translate them.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux (desktop window)
        - Linux (headless)
        - Android
        - iOS / iPadOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nightly build
      description: The date or commit in the nightly's title, e.g. "2026-10-17 · c99a966c".
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Bug Report Dump
      description: Drag the `bugreport_….zip` into this box. If it is larger than 25 MB, upload it somewhere (Google Drive, Dropbox, OneDrive, WeTransfer) and paste the link.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
