name: Update Scenarios

# The update and settings-survival harness (Tests/AgOpenWeb.UpdateScenarios.Tests): a season's
# settings, profiles, casters, fields, tracks, flags and a job are made on an older AgOpenWeb
# release (its Linux daemon bundle, downloaded from the GitHub release and driven over its
# WebSocket as the web client does), the daemon is stopped as systemd stops it, and this build
# starts on the same data folder: everything is read back and compared with what was set. Then
# the same farm on this build through a restart, a power cut, files cut short (fault injection)
# and what a power cut really leaves, a moved data folder, a comma-decimal locale, and AgOpenGPS
# field folders and installations. About 15 minutes, so it runs
# nightly on develop, not on every PR (CI only builds it).
# The run fails when the harness breaks; the findings are in the report, kept as an artifact
# and shown in the run's summary.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked, from the releases given.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, NIGHTLY_CRON 05:07 UTC, 23:07 US
  # Central) starts it with nightly=true. GitHub's own schedule started this repo's runs 5-8 hours
  # late every day (2026-10 and 11), so the reports weren't in by morning. Each harness has its
  # own runner, so they run side by side.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false
      update_from:
        description: 'Releases to update from (tags, comma-separated); their Linux x64 bundles are downloaded'
        required: false
        default: 'v26.7.1,v26.7.2,v26.7.3,v26.7.4'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: update-scenarios
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Anything new since the last night?
        id: fresh
        run: |
          # A slow harness: only when what it covers changed, and on Sundays (the script).
          .github/scripts/nightly-fresh.sh "${{ inputs.nightly }}" \
            Shared/AgOpenWeb.Services/ConfigurationService.cs \
            Shared/AgOpenWeb.Services/SettingsService.cs \
            Shared/AgOpenWeb.Services/Profile \
            Shared/AgOpenWeb.Services/VehicleProfileService.cs \
            Shared/AgOpenWeb.Services/ToolProfileService.cs \
            Shared/AgOpenWeb.Services/NtripProfileService.cs \
            Shared/AgOpenWeb.Services/FieldService.cs \
            Shared/AgOpenWeb.Services/Fields \
            Shared/AgOpenWeb.Services/GeoJson \
            Shared/AgOpenWeb.Services/Storage \
            Shared/AgOpenWeb.Services/Coverage \
            Shared/AgOpenWeb.Services/JobService.cs \
            Shared/AgOpenWeb.Services/ImportFolder.cs \
            Shared/AgOpenWeb.Services/ImportFolderScanner.cs \
            Shared/AgOpenWeb.Services/PersistentStateService.cs \
            Shared/AgOpenWeb.Models/Configuration \
            Shared/AgOpenWeb.Models/AppSettings.cs \
            Shared/AgOpenWeb.Models/Field \
            Shared/AgOpenWeb.Models/GeoJson \
            Shared/AgOpenWeb.Models/Job \
            Tests/AgOpenWeb.UpdateScenarios.Tests \
            Tests/ScenarioShared \
            .github/workflows/update-scenarios.yml

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A cache key may not hold commas: the release list with dashes.
      - name: Cache key for the release list
        if: steps.fresh.outputs.run == 'true'
        id: bundles
        run: echo "key=agopenweb-release-bundles-$(echo '${{ inputs.update_from || 'v26.7.1,v26.7.2,v26.7.3,v26.7.4' }}' | tr ', ' '--')" >> "$GITHUB_OUTPUT"

      - name: Release bundles from earlier nights
        if: steps.fresh.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agopenweb-releases
          key: ${{ steps.bundles.outputs.key }}
          # A new tag in the list keeps the bundles already cached; only the new one is downloaded.
          restore-keys: agopenweb-release-bundles-

      - name: Run the update scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/update-scenarios-report.md
          AGOPENWEB_UPDATE_CACHE: ${{ runner.temp }}/agopenweb-releases
          AGOPENWEB_UPDATE_FROM: ${{ inputs.update_from || 'v26.7.1,v26.7.2,v26.7.3,v26.7.4' }}
          # The release's API entry holds each bundle's SHA-256; authenticated for the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet test Tests/AgOpenWeb.UpdateScenarios.Tests/ --filter "FullyQualifiedName~UpdateScenarioTests" --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/update-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-scenarios-report
          path: ${{ runner.temp }}/update-scenarios-report.md
          if-no-files-found: ignore
          retention-days: 30
