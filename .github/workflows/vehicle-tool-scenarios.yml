name: Vehicle & Tool Scenarios

# The Vehicle & Tool scenario harness (Tests/AgOpenWeb.VehicleToolScenarios.Tests): a simulated
# machine (steering, implement linkage, antenna on a slope, the Boards simulator's GPS, IMU and
# steering motor) drives the whole backend in process, set up by a careful and a careless
# operator. It takes minutes, so it runs nightly on develop, not on every PR (CI only builds it).
# The run fails when the harness breaks; the findings are in the report, kept as an artifact
# and shown in the run's summary. The settings sweep (every guidance, AutoSteer, tool and
# vehicle setting flipped, 1 h 45 in one piece) runs in the shards of
# Tools/harness-runner/sweep-shards.txt, each on its own runner beside the two operators: the
# longest part is about 40 minutes.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, cron 05:07 UTC, 23:07 US Central)
  # starts it with nightly=true. GitHub's own schedule started this repo's runs 5-8 hours late
  # every day (2026-10 and 11), so the reports weren't in by morning. Each harness has its own
  # runner, so they run side by side.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  # By branch: a run on a branch (a refactor round) must not cancel develop's, nor the other way.
  group: vehicle-tool-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The parts: the two operators and the sweep's shards (Tools/harness-runner/sweep-shards.py),
  # after checking that the shards split the sweep's table, every row in one shard.
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 Tools/harness-runner/sweep-shards.py matrix Tests/AgOpenWeb.VehicleToolScenarios.Tests/SettingsSweep.cs)" >> "$GITHUB_OUTPUT"

  scenarios:
    # Each part on its own runner, side by side.
    needs: shards
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    name: scenarios (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Anything new since the last night?
        id: fresh
        env:
          NIGHTLY_ALWAYS: ${{ vars.NIGHTLY_ALWAYS }}
        run: |
          # The settings sweep (about 100 min) only when what it covers changed, and on Sundays;
          # the operators every night with a commit.
          if [ "${{ matrix.part.who }}" = sweep ]; then
            .github/scripts/nightly-fresh.sh "${{ inputs.nightly }}" \
            Shared/AgOpenWeb.Services/AutoSteer \
            Shared/AgOpenWeb.Services/Track \
            Shared/AgOpenWeb.Services/Tool \
            Shared/AgOpenWeb.Services/Section \
            Shared/AgOpenWeb.Services/Pipeline \
            Shared/AgOpenWeb.Services/YouTurn \
            Shared/AgOpenWeb.Services/Gps \
            Shared/AgOpenWeb.Services/GpsService.cs \
            Shared/AgOpenWeb.Services/UdpCommunicationService.cs \
            Shared/AgOpenWeb.Services/ModuleCommunicationService.cs \
            Shared/AgOpenWeb.Services/ConfigurationService.cs \
            Shared/AgOpenWeb.Models/Configuration \
            Shared/AgOpenWeb.Models/Tool \
            Shared/AgOpenWeb.Models/Vehicle \
            Shared/AgOpenWeb.Models/Guidance \
            Shared/AgOpenWeb.Models/Track \
            Shared/AgOpenWeb.RemoteWiring/RemoteServerWiring.Helpers.cs \
            Simulators/AgOpenWeb.VirtualModules \
            Tests/AgOpenWeb.VehicleToolScenarios.Tests \
            Tests/ScenarioShared \
            .github/workflows/vehicle-tool-scenarios.yml
          else .github/scripts/nightly-fresh.sh "${{ inputs.nightly }}"; fi

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run the Vehicle & Tool scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/vehicle-tool-scenarios-report.md
          AGOPENWEB_SCENARIO_OPERATOR: ${{ matrix.part.who }}
          AGOPENWEB_SCENARIO_ONLY: ${{ matrix.part.only }}
        run: dotnet test Tests/AgOpenWeb.VehicleToolScenarios.Tests/ -c Release --filter "FullyQualifiedName~VehicleToolScenarioTests" --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/vehicle-tool-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-tool-scenarios-report-${{ matrix.part.name }}
          path: ${{ runner.temp }}/vehicle-tool-scenarios-report.md
          if-no-files-found: ignore
          retention-days: 30

      # Each kind of finding leaves the app's bug report dump taken where it was first seen
      # (Tests/AgOpenWeb.VehicleToolScenarios.Tests/VtEvidence.cs): the fix is made and proven from
      # it, without a rerun.
      - name: Keep the evidence
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-tool-scenarios-evidence-${{ matrix.part.name }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 30
