name: Steer Wizard Scenarios

# The steer wizard scenario harness (Tests/AgOpenWeb.SteerWizardScenarios.Tests): the whole
# backend in process, an emulated AiO steer module and a moving tractor behind it, the steer
# wizard driven by a careful and a careless operator. It takes about 20 minutes, so it runs
# nightly on develop, not on every PR (CI only builds it). The run fails when the harness
# breaks or the safety watch saw the wheels move when they shouldn't; the other findings are
# in the report, kept as an artifact and shown in the run's summary.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, cron 05:07 UTC, 23:07 US Central)
  # starts it with nightly=true. GitHub's own schedule started this repo's runs 5-8 hours late
  # every day (2026-10 and 11), so the reports weren't in by morning. Each harness has its own
  # runner, so they run side by side.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: steer-wizard-scenarios
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last night?
        id: fresh
        run: |
          if [ "${{ inputs.nightly }}" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit on develop in the last 25 hours; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run the steer wizard scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/steer-wizard-scenarios-report.md
        run: dotnet test Tests/AgOpenWeb.SteerWizardScenarios.Tests/ --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/steer-wizard-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: steer-wizard-scenarios-report
          path: ${{ runner.temp }}/steer-wizard-scenarios-report.md
          if-no-files-found: ignore
          retention-days: 30
