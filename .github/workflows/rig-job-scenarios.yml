name: Rig Job Scenarios

# The rig job scenarios (RigJobScenarioTests in Tests/AgOpenWeb.FieldJobScenarios.Tests): the field
# job harness with the rigs and tracks testers use. A mower shifted 2.5 m to one side (mounted and
# trailed, and once on the edge pass), a curve recorded by driving it, a 21 m implement skipping a
# row at every U-turn, a tester's tractor with a front sprayer of unequal sections and a semi-mounted
# drill, a combine, a drill behind its tank (TBT), a manure spreader, a disc harrow, a reversible
# plough; the same simulated machine, emulated machine module and truth coverage as the
# field jobs, and the implement measured against the pass it should be on. About an hour and a half, so it
# runs nightly on develop, not on every PR (CI only builds it). The run fails when the harness
# breaks; the findings are in the report, kept as an artifact and shown in the run's summary.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, cron 03:07 UTC, 21:07 US Central)
  # starts it with nightly=true, as the other harnesses. Each harness has its own runner, so they
  # run side by side.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: rig-job-scenarios
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last night?
        id: fresh
        run: |
          if [ "${{ inputs.nightly }}" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit on develop in the last 25 hours; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run the rig job scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/rig-job-scenarios-report.md
        run: dotnet test Tests/AgOpenWeb.FieldJobScenarios.Tests/ --filter "FullyQualifiedName~RigJobScenarioTests" --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/rig-job-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rig-job-scenarios-report
          path: ${{ runner.temp }}/rig-job-scenarios-report.md
          if-no-files-found: ignore
          retention-days: 30
