name: Web Client Scenarios

# The web client scenario harness (Tests/AgOpenWeb.WebClientScenarios.Tests): the whole backend in
# process with its real UDP service and web server, the real web client in headless Chromium
# (Playwright) on the screens a farm uses (10" and 7" tablets, a 720p cab PC, a 5" screen, a phone
# both ways), a second screen beside the operator's, and the operator's screen going away while the
# tractor works (tab closed, Wi-Fi out of range or dropped, tablet asleep, reload, Free Drive, a
# section on by hand), with what the steer module and the sections got read at the module port;
# and the operator's flows by taps and typing (tracks, boundary and headland, tram lines, fields
# and jobs, the section bar, the U-turn buttons), careful and careless.
# It takes about 25 minutes of real time, so it runs nightly on develop, not on every PR (CI only
# builds it). The run fails when the harness breaks; the findings are in the report, kept as an
# artifact with the screenshots and shown in the run's summary.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, cron 03:07 UTC, 21:07 US Central)
  # starts it with nightly=true, as the other harnesses.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: web-client-scenarios
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last night?
        id: fresh
        run: |
          if [ "${{ inputs.nightly }}" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit on develop in the last 25 hours; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the harness
        if: steps.fresh.outputs.run == 'true'
        run: dotnet build Tests/AgOpenWeb.WebClientScenarios.Tests/ --verbosity minimal

      # Playwright's own Chromium, kept between runs for the version of Microsoft.Playwright the
      # harness uses (a new version gets its own browser). The system libraries are installed
      # every run (--with-deps), as they live outside the cache.
      - name: Microsoft.Playwright version
        if: steps.fresh.outputs.run == 'true'
        id: pw
        run: |
          v=$(grep -o 'Include="Microsoft.Playwright" Version="[^"]*"' Tests/AgOpenWeb.WebClientScenarios.Tests/AgOpenWeb.WebClientScenarios.Tests.csproj | sed 's/.*Version="\([^"]*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        if: steps.fresh.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.fresh.outputs.run == 'true'
        run: pwsh Tests/AgOpenWeb.WebClientScenarios.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the web client scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/web-client/web-client-scenarios-report.md
        run: dotnet test Tests/AgOpenWeb.WebClientScenarios.Tests/ --no-build --filter "FullyQualifiedName~WebClientScenarioTests" --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/web-client/web-client-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report and the screenshots
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-client-scenarios-report
          path: ${{ runner.temp }}/web-client/
          if-no-files-found: ignore
          retention-days: 30
