name: Turn Intervention Scenarios

# The turn intervention scenarios (TurnInterventionScenarioTests in Tests/AgOpenWeb.FieldJobScenarios.Tests):
# the field job on Olival with an operator who acts while a U-turn is planned or under way. U-turn
# radius, distance from boundary or style changed mid-turn, skip rows set during a turn and before
# it, the arrow tapped twice, a nudge, reversing in the turn and out of it, AutoSteer off and on;
# then U-turns made only with the manual buttons, and a manual turn in the middle of a pass. About
# an hour, so it runs nightly on develop, not on every PR (CI only builds it). The run fails when
# the harness breaks; the findings are in the report, kept as an artifact and shown in the summary.
#
#   - nightly (dispatched with nightly=true): only when develop has a commit from the last day;
#   - manual dispatch: always, on the branch picked.

on:
  # Nightly: the bug report Worker (Tools/bugreport-worker, cron 03:07 UTC, 21:07 US Central)
  # starts it with nightly=true, as the other harnesses. Each harness has its own runner, so they
  # run side by side.
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly run: skip when develop has no commit from the last 25 hours'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.401'   # as build-and-release.yml
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: turn-intervention-scenarios
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Anything new since the last night?
        id: fresh
        run: |
          if [ "${{ inputs.nightly }}" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 90000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commit on develop in the last 25 hours; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/sharpisoterm-cache
        if: steps.fresh.outputs.run == 'true'

      - name: Setup .NET
        if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run the turn intervention scenarios
        if: steps.fresh.outputs.run == 'true'
        env:
          AGOPENWEB_SCENARIO_REPORT: ${{ runner.temp }}/turn-intervention-scenarios-report.md
        run: dotnet test Tests/AgOpenWeb.FieldJobScenarios.Tests/ --filter "FullyQualifiedName~TurnInterventionScenarioTests" --verbosity normal

      - name: Report to the summary
        if: always() && steps.fresh.outputs.run == 'true'
        run: |
          f="${{ runner.temp }}/turn-intervention-scenarios-report.md"
          if [ -f "$f" ]; then
            # The summary has a size limit; the whole report is in the artifact.
            head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always() && steps.fresh.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: turn-intervention-scenarios-report
          path: ${{ runner.temp }}/turn-intervention-scenarios-report.md
          if-no-files-found: ignore
          retention-days: 30
